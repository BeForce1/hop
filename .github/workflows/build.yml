name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # csc.exe is part of Windows, so there is no setup step and no restore.
      - name: Build
        shell: pwsh
        run: .\build.ps1

      - name: Smoke test
        shell: pwsh
        run: |
          # --dump against whatever window exists on the runner. We are not asserting
          # a target count (a headless runner has almost no UI) - only that the exe
          # starts, enumerates, and exits 0 instead of crashing.
          $p = Start-Process .\hop.exe -ArgumentList '--dump','0' -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "hop --dump exited $($p.ExitCode)" }
          Write-Host "ok: hop.exe runs and exits cleanly"

      - uses: actions/upload-artifact@v4
        with:
          name: hop.exe
          path: hop.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hop.exe
          generate_release_notes: true
